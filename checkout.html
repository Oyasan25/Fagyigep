<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ICE CREAM | Checkout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>CHECKOUT</h1>
    </header>

    <div class="checkout-container">
        <div class="checkout-form">
            <h3>Shipping Information</h3>
            <input type="text" placeholder="Full Name">
            <input type="email" placeholder="Email Address">
            <input type="text" placeholder="Shipping Address">
            <div class="form-row">
                <input type="text" placeholder="City">
                <input type="text" placeholder="Postal Code">
            </div>
            
            <h3 style="margin-top:30px;">Payment Details</h3>
            <input type="text" placeholder="Card Number (0000 0000 0000 0000)">
            <div class="form-row">
                <input type="text" placeholder="MM/YY">
                <input type="text" placeholder="CVC">
            </div>
            <button class="order-btn" style="margin-top:20px;">Complete Order</button>
            <p style="text-align:center;"><a href="index.html" style="color:#999; font-size:0.8rem;">Return to Shop</a></p>
        </div>
    </div>
</body>
</html>
